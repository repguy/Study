openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Cluvi API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: study-packs
    description: Study pack operations
  - name: flashcards
    description: Flashcard operations
  - name: quiz
    description: Quiz operations
  - name: user
    description: User profile and stats
  - name: gemini
    description: Gemini AI chat and image operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /user/profile:
    get:
      operationId: getUserProfile
      tags: [user]
      summary: Get current user profile and stats
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
    put:
      operationId: updateUserProfile
      tags: [user]
      summary: Update user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserProfileUpdate"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  /user/stats:
    get:
      operationId: getUserStats
      tags: [user]
      summary: Get user gamification stats (XP, streak, level)
      responses:
        "200":
          description: User stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserStats"

  /study-packs:
    get:
      operationId: listStudyPacks
      tags: [study-packs]
      summary: List all study packs for current user
      responses:
        "200":
          description: List of study packs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudyPack"
    post:
      operationId: createStudyPack
      tags: [study-packs]
      summary: Create a study pack from text content (triggers AI generation)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudyPackInput"
      responses:
        "201":
          description: Created study pack
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyPack"

  /study-packs/dashboard:
    get:
      operationId: getDashboardSummary
      tags: [study-packs]
      summary: Get dashboard summary (counts, recent activity, weak topics, study strength)
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /study-packs/{id}:
    get:
      operationId: getStudyPack
      tags: [study-packs]
      summary: Get a study pack with all generated content
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Study pack with content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyPackFull"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteStudyPack
      tags: [study-packs]
      summary: Delete a study pack
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /study-packs/{id}/generate:
    post:
      operationId: generateStudyPackContent
      tags: [study-packs]
      summary: Re-generate or expand AI content for a study pack
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated study pack with regenerated content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyPackFull"

  /study-packs/{id}/flashcards:
    get:
      operationId: listFlashcards
      tags: [flashcards]
      summary: List flashcards for a study pack
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of flashcards
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Flashcard"

  /study-packs/{id}/flashcards/{cardId}/confidence:
    patch:
      operationId: rateFlashcardConfidence
      tags: [flashcards]
      summary: Rate confidence on a flashcard (spaced repetition)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: cardId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfidenceRating"
      responses:
        "200":
          description: Updated flashcard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Flashcard"

  /study-packs/{id}/quiz:
    get:
      operationId: getQuizQuestions
      tags: [quiz]
      summary: Get quiz questions for a study pack
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of quiz questions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QuizQuestion"

  /study-packs/{id}/quiz/submit:
    post:
      operationId: submitQuizResult
      tags: [quiz]
      summary: Submit quiz result and get score + recommendations
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuizSubmission"
      responses:
        "200":
          description: Quiz result with score and analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizResult"

  /study-packs/{id}/quiz-history:
    get:
      operationId: getQuizHistory
      tags: [quiz]
      summary: Get past quiz results for a study pack
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of past quiz results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QuizResult"

  /gemini/conversations:
    get:
      operationId: listGeminiConversations
      tags: [gemini]
      summary: List all conversations
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GeminiConversation"
    post:
      operationId: createGeminiConversation
      tags: [gemini]
      summary: Create a new conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeminiConversationInput"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeminiConversation"

  /gemini/conversations/{id}:
    get:
      operationId: getGeminiConversation
      tags: [gemini]
      summary: Get conversation with messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeminiConversationWithMessages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeminiError"
    delete:
      operationId: deleteGeminiConversation
      tags: [gemini]
      summary: Delete a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeminiError"

  /gemini/conversations/{id}/messages:
    get:
      operationId: listGeminiMessages
      tags: [gemini]
      summary: List messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GeminiMessage"
    post:
      operationId: sendGeminiMessage
      tags: [gemini]
      summary: Send a message and receive an AI response (SSE stream)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeminiMessageInput"
      responses:
        "200":
          description: SSE stream of assistant response chunks
          content:
            text/event-stream: {}

  /gemini/generate-image:
    post:
      operationId: generateGeminiImage
      tags: [gemini]
      summary: Generate an image from a text prompt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeminiImageInput"
      responses:
        "200":
          description: Generated image data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeminiImageOutput"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    UserProfile:
      type: object
      properties:
        id:
          type: integer
        clerkId:
          type: string
        displayName:
          type: ["string", "null"]
        isPro:
          type: boolean
        credits:
          type: integer
        aiModel:
          type: string
        customAiModel:
          type: ["string", "null"]
        xp:
          type: integer
        level:
          type: integer
        streak:
          type: integer
        lastActiveDate:
          type: ["string", "null"]
          format: date
        totalPacks:
          type: integer
        totalFlashcardsStudied:
          type: integer
        totalQuizzesTaken:
          type: integer
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - clerkId
        - isPro
        - credits
        - aiModel
        - xp
        - level
        - streak
        - totalPacks
        - totalFlashcardsStudied
        - totalQuizzesTaken
        - createdAt

    UserProfileUpdate:
      type: object
      properties:
        displayName:
          type: string

    UserStats:
      type: object
      properties:
        xp:
          type: integer
        level:
          type: integer
        streak:
          type: integer
        credits:
          type: integer
        studyStrength:
          type: integer
          description: 0-100 study strength score
        examReadiness:
          type: integer
          description: 0-100 exam readiness score
        totalPacks:
          type: integer
        totalFlashcardsStudied:
          type: integer
        totalQuizzesTaken:
          type: integer
        averageQuizScore:
          type: number
        weeklyXP:
          type: integer
        xpToNextLevel:
          type: integer
      required:
        - xp
        - level
        - streak
        - credits
        - studyStrength
        - examReadiness
        - totalPacks
        - totalFlashcardsStudied
        - totalQuizzesTaken
        - averageQuizScore
        - weeklyXP
        - xpToNextLevel

    StudyPack:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        title:
          type: string
        sourceType:
          type: string
          enum: [text, pdf, image, url]
        status:
          type: string
          enum: [processing, ready, error]
        summary:
          type: ["string", "null"]
        shareToken:
          type: ["string", "null"]
        aiModelUsed:
          type: ["string", "null"]
        flashcardCount:
          type: integer
        quizCount:
          type: integer
        examPredictionCount:
          type: integer
        studyStrength:
          type: integer
          description: 0-100 mastery score for this pack
        isPro:
          type: boolean
          description: Whether this pack has pro features unlocked
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - title
        - sourceType
        - status
        - flashcardCount
        - quizCount
        - examPredictionCount
        - studyStrength
        - isPro
        - createdAt
        - updatedAt

    StudyPackInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        sourceType:
          type: string
          enum: [text, pdf, image, url]
        content:
          type: string
          description: Raw text content, base64-encoded file, or URL
      required:
        - title
        - sourceType
        - content

    StudyPackFull:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        title:
          type: string
        sourceType:
          type: string
          enum: [text, pdf, image]
        status:
          type: string
          enum: [processing, ready, error]
        summary:
          type: ["string", "null"]
        keyConcepts:
          type: array
          items:
            type: string
        examPredictions:
          type: array
          items:
            type: string
        flashcardCount:
          type: integer
        quizCount:
          type: integer
        examPredictionCount:
          type: integer
        studyStrength:
          type: integer
        isPro:
          type: boolean
        shareToken:
          type: ["string", "null"]
        aiModelUsed:
          type: ["string", "null"]
        flashcards:
          type: array
          items:
            $ref: "#/components/schemas/Flashcard"
        quizQuestions:
          type: array
          items:
            $ref: "#/components/schemas/QuizQuestion"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - title
        - sourceType
        - status
        - flashcardCount
        - quizCount
        - examPredictionCount
        - studyStrength
        - isPro
        - flashcards
        - quizQuestions
        - createdAt
        - updatedAt

    DashboardSummary:
      type: object
      properties:
        totalPacks:
          type: integer
        recentPacks:
          type: array
          items:
            $ref: "#/components/schemas/StudyPack"
        xp:
          type: integer
        level:
          type: integer
        streak:
          type: integer
        studyStrength:
          type: integer
        examReadiness:
          type: integer
        averageQuizScore:
          type: number
        weakTopics:
          type: array
          items:
            type: string
        totalFlashcardsStudied:
          type: integer
        totalQuizzesTaken:
          type: integer
      required:
        - totalPacks
        - recentPacks
        - xp
        - level
        - streak
        - studyStrength
        - examReadiness
        - averageQuizScore
        - weakTopics
        - totalFlashcardsStudied
        - totalQuizzesTaken

    Flashcard:
      type: object
      properties:
        id:
          type: integer
        studyPackId:
          type: integer
        front:
          type: string
        back:
          type: string
        confidenceLevel:
          type: integer
          description: 1-5 confidence rating from user
        nextReviewAt:
          type: ["string", "null"]
          format: date-time
        timesStudied:
          type: integer
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - studyPackId
        - front
        - back
        - confidenceLevel
        - timesStudied
        - createdAt

    ConfidenceRating:
      type: object
      properties:
        confidence:
          type: integer
          minimum: 1
          maximum: 5
      required:
        - confidence

    QuizQuestion:
      type: object
      properties:
        id:
          type: integer
        studyPackId:
          type: integer
        question:
          type: string
        options:
          type: array
          items:
            type: string
        correctAnswer:
          type: integer
          description: Index of correct option (0-based)
        explanation:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - studyPackId
        - question
        - options
        - correctAnswer
        - createdAt

    QuizSubmission:
      type: object
      properties:
        answers:
          type: array
          items:
            type: object
            properties:
              questionId:
                type: integer
              selectedAnswer:
                type: integer
            required:
              - questionId
              - selectedAnswer
        timeTakenSeconds:
          type: integer
      required:
        - answers

    QuizResult:
      type: object
      properties:
        id:
          type: integer
        studyPackId:
          type: integer
        score:
          type: integer
          description: Percentage score 0-100
        correctCount:
          type: integer
        totalQuestions:
          type: integer
        timeTakenSeconds:
          type: ["integer", "null"]
        xpEarned:
          type: integer
        weakAreas:
          type: array
          items:
            type: string
        recommendations:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - studyPackId
        - score
        - correctCount
        - totalQuestions
        - xpEarned
        - weakAreas
        - recommendations
        - createdAt

    GeminiConversation:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - createdAt

    GeminiMessage:
      type: object
      properties:
        id:
          type: integer
        conversationId:
          type: integer
        role:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - conversationId
        - role
        - content
        - createdAt

    GeminiConversationInput:
      type: object
      properties:
        title:
          type: string
      required:
        - title

    GeminiMessageInput:
      type: object
      properties:
        content:
          type: string
      required:
        - content

    GeminiConversationWithMessages:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        messages:
          type: array
          items:
            $ref: "#/components/schemas/GeminiMessage"
      required:
        - id
        - title
        - createdAt
        - messages

    GeminiImageInput:
      type: object
      properties:
        prompt:
          type: string
      required:
        - prompt

    GeminiImageOutput:
      type: object
      properties:
        b64_json:
          type: string
        mimeType:
          type: string
      required:
        - b64_json
        - mimeType

    GeminiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
